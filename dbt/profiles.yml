lumina:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: gold
      location: "{{ env_var('GCP_REGION', 'us-central1') }}"
      threads: 4
      job_execution_timeout_seconds: 300
      # Safety cap per query: 10 GB.
      maximum_bytes_billed: 10000000000
